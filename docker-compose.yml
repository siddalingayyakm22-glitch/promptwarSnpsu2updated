version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cybershield-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cybershield-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cybershield-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - cybershield-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybershield-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/cybershield
      - AI_SERVICE_URL=http://ai-service:8000
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb
      - ai-service
    networks:
      - cybershield-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybershield-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - cybershield-net

networks:
  cybershield-net:
    driver: bridge

volumes:
  mongo_data:
